<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f1a"><meta name="description" content="TripCo smart trip planner"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | Planner 4.0</title></head><body data-page="planner"><div id="siteHeader"></div><main>
<section class="page-hero"><div class="container"><div class="page-kicker">TripCo Planner 4.0</div><h1 data-ar="خطط رحلتك بذكاء أكثر" data-en="Plan your trip more intelligently"></h1><p data-ar="مخطط متعدد المراحل يوازن بين الوقت والميزانية والاهتمامات وطبيعة المجموعة، ثم يبني برنامجًا يوميًا قابلًا للحفظ وإعادة الترتيب والإضافة إلى السلة." data-en="A multi-stage planner that balances time, budget, interests and group profile, then creates a daily itinerary you can save, reorder and add to the cart."></p></div></section>
<section class="section"><div class="container planner-v4-shell"><aside class="planner-v4-sidebar"><span class="chip dark">SMART JOURNEY</span><h3 data-ar="مراحل بناء الرحلة" data-en="Journey builder"></h3><p data-ar="كل خطوة تضيف سياقًا جديدًا للخطة قبل توليد البرنامج." data-en="Each step adds context before the itinerary is generated."></p><div class="planner-v4-progress"><div class="pv-step active" data-pv="1"><b>1</b><span data-ar="الوجهة والمدة" data-en="Destination & time"></span></div><div class="pv-step" data-pv="2"><b>2</b><span data-ar="الميزانية والإيقاع" data-en="Budget & pace"></span></div><div class="pv-step" data-pv="3"><b>3</b><span data-ar="الاهتمامات" data-en="Interests"></span></div><div class="pv-step" data-pv="4"><b>4</b><span data-ar="الاحتياجات" data-en="Needs"></span></div></div><div style="margin-top:18px"><div style="display:flex;justify-content:space-between;font-size:9px;margin-bottom:7px"><span data-ar="اكتمال المدخلات" data-en="Input completion"></span><b id="plannerCompletion">25%</b></div><div class="tc4-meter"><i id="plannerMeter" style="width:25%"></i></div></div><div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)"><small data-ar="ملاحظة: التكاليف في النموذج تقديرية وليست أسعار حجز فعلية." data-en="Note: costs are illustrative estimates, not live booking prices."></small></div></aside>
<div class="planner-v4-work"><form id="plannerWizard" class="planner-v4-card"><div data-step-panel="1"><span class="chip sea" data-ar="الخطوة 1 من 4" data-en="Step 1 of 4"></span><h2 data-ar="وين ومتى؟" data-en="Where and when?"></h2><p data-ar="ابدأ بتحديد المدينة، مدة الرحلة وعدد المسافرين." data-en="Start with destination, trip length and travelers."></p><div class="field-row"><label class="field"><span data-i18n="destination"></span><select name="city"><option value="jeddah">جدة · Jeddah</option><option value="riyadh">الرياض · Riyadh</option><option value="alula">العُلا · AlUla</option><option value="diriyah">الدرعية · Diriyah</option><option value="abha">أبها · Abha</option></select></label><label class="field"><span data-i18n="days"></span><input name="days" type="number" min="1" max="10" value="3"></label></div><div class="field-row"><label class="field"><span data-i18n="travelers"></span><input name="travelers" type="number" min="1" max="12" value="2"></label><label class="field"><span data-ar="نوع الرحلة" data-en="Trip profile"></span><select name="tripType"><option value="friends" data-ar="أصدقاء" data-en="Friends">أصدقاء</option><option value="family" data-ar="عائلية" data-en="Family">عائلية</option><option value="solo" data-ar="فردية" data-en="Solo">فردية</option><option value="couple" data-ar="ثنائية" data-en="Couple">ثنائية</option></select></label></div></div>
<div data-step-panel="2" class="hidden"><span class="chip sea" data-ar="الخطوة 2 من 4" data-en="Step 2 of 4"></span><h2 data-ar="كيف تحب تمشي الرحلة؟" data-en="How should the trip feel?"></h2><p data-ar="حدد مستوى الميزانية وإيقاع اليوم ووقت بداية الأنشطة." data-en="Choose budget level, daily pace and start time."></p><div class="choice-grid"><label class="choice"><input type="radio" name="budget" value="economy"><b data-i18n="economy"></b><small data-ar="خيارات عملية وتكلفة أخف" data-en="Practical, lower-cost choices"></small></label><label class="choice"><input type="radio" name="budget" value="mid" checked><b data-i18n="mid"></b><small data-ar="توازن بين الراحة والتكلفة" data-en="Balanced comfort and cost"></small></label><label class="choice"><input type="radio" name="budget" value="premium"><b data-i18n="premium"></b><small data-ar="تجارب وراحة أعلى" data-en="Higher comfort and experiences"></small></label></div><div class="field-row" style="margin-top:14px"><label class="field"><span data-i18n="pace"></span><select name="pace"><option value="relaxed" data-i18n="relaxed"></option><option value="balanced" selected data-i18n="balanced"></option><option value="packed" data-i18n="packed"></option></select></label><label class="field"><span data-ar="بداية اليوم" data-en="Day starts"></span><select name="startTime"><option value="08:00">08:00</option><option value="09:00" selected>09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option></select></label></div></div>
<div data-step-panel="3" class="hidden"><span class="chip sea" data-ar="الخطوة 3 من 4" data-en="Step 3 of 4"></span><h2 data-ar="وش تحب أكثر؟" data-en="What do you enjoy most?"></h2><p data-ar="اختر اهتمامات متعددة، وسيتم ترتيب الأنشطة حسب مدى تطابقها." data-en="Choose multiple interests; activities will be ranked by match."></p><div class="choice-grid"><label class="choice"><input type="checkbox" name="interests" value="heritage" checked><b data-ar="تراث" data-en="Heritage"></b></label><label class="choice"><input type="checkbox" name="interests" value="sea" checked><b data-ar="بحر" data-en="Sea"></b></label><label class="choice"><input type="checkbox" name="interests" value="food" checked><b data-ar="مطاعم" data-en="Food"></b></label><label class="choice"><input type="checkbox" name="interests" value="nature"><b data-ar="طبيعة" data-en="Nature"></b></label><label class="choice"><input type="checkbox" name="interests" value="photo"><b data-ar="تصوير" data-en="Photography"></b></label><label class="choice"><input type="checkbox" name="interests" value="adventure"><b data-ar="مغامرات" data-en="Adventure"></b></label><label class="choice"><input type="checkbox" name="interests" value="shopping"><b data-ar="تسوق" data-en="Shopping"></b></label><label class="choice"><input type="checkbox" name="interests" value="culture"><b data-ar="ثقافة" data-en="Culture"></b></label></div></div>
<div data-step-panel="4" class="hidden"><span class="chip sea" data-ar="الخطوة 4 من 4" data-en="Step 4 of 4"></span><h2 data-ar="آخر لمسات الخطة" data-en="Final trip details"></h2><p data-ar="أضف احتياجات تؤثر على التوصيات وطريقة عرض الخطة." data-en="Add needs that influence recommendations and presentation."></p><div class="choice-grid"><label class="choice"><input type="checkbox" name="family"><b data-i18n="family"></b><small data-ar="أماكن مناسبة للعائلة" data-en="Family-friendly places"></small></label><label class="choice"><input type="checkbox" name="accessibility"><b data-i18n="accessibility"></b><small data-ar="أولوية للأماكن الأسهل وصولًا" data-en="Prioritize accessible places"></small></label><label class="choice"><input type="checkbox" name="avoidLate"><b data-ar="بدون سهر" data-en="No late nights"></b><small data-ar="إنهاء الأنشطة مبكرًا" data-en="Finish activities earlier"></small></label></div><div class="field-row" style="margin-top:14px"><label class="field"><span data-ar="التنقل" data-en="Transport"></span><select name="transport"><option value="public" data-i18n="publicTransport"></option><option value="car" data-i18n="ownCar"></option><option value="mixed" data-ar="مزيج بين الاثنين" data-en="Mixed"></option></select></label><label class="field"><span data-ar="السكن" data-en="Stay style"></span><select name="stay"><option value="hotel" data-ar="فندق" data-en="Hotel">فندق</option><option value="apartment" data-ar="شقة فندقية" data-en="Serviced apartment">شقة فندقية</option><option value="resort" data-ar="منتجع" data-en="Resort">منتجع</option></select></label></div></div>
<div style="display:flex;justify-content:space-between;gap:8px;margin-top:24px"><button type="button" class="btn" id="prevStep" data-i18n="back"></button><div style="display:flex;gap:8px"><button type="button" class="btn" id="resetPlan" data-i18n="resetPlan"></button><button type="button" class="btn primary" id="nextStep" data-i18n="next"></button><button type="submit" class="btn primary hidden" id="generatePlan" data-i18n="generate"></button></div></div></form>
<div class="planner-v4-card"><div class="planner-v4-summary" id="liveSummary"><div class="metric"><b>جدة</b><span data-ar="الوجهة" data-en="Destination"></span></div><div class="metric"><b>3</b><span data-ar="الأيام" data-en="Days"></span></div><div class="metric"><b>2</b><span data-ar="المسافرون" data-en="Travelers"></span></div><div class="metric"><b data-ar="متوسطة" data-en="Mid"></b><span data-ar="الميزانية" data-en="Budget"></span></div></div></div><div id="planOutput"></div></div></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/core.js"></script><script src="assets/js/planner-v4.js"></script><script src="assets/js/v4.js"></script></body></html>
