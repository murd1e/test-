<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b4f"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | Research File</title></head><body data-page="about"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><div class="page-kicker">Project Research File</div><h1 data-ar="ملف المشروع العلمي" data-en="Project research file"></h1><p data-ar="توثيق فكرة TripCo من المشكلة والهدف حتى النتائج والتطبيقات والأعمال المستقبلية." data-en="TripCo documentation from problem and goal through results, applications and future work."></p></div></section><section class="section"><div class="container"><div class="cards"><article class="card"><span class="chip">01</span><h3 data-ar="المشكلة" data-en="Problem"></h3><p data-ar="يواجه السائح تشتتًا بين مواقع وتطبيقات مختلفة للسكن والمطاعم والفعاليات والمواصلات والخرائط، مما يزيد الوقت والجهد ويصعب مقارنة الخيارات." data-en="Travelers often switch between separate apps for stays, dining, events, transport and maps, increasing time and fragmentation."></p></article><article class="card"><span class="chip sea">02</span><h3 data-ar="الهدف" data-en="Goal"></h3><p data-ar="إنشاء منصة سياحية موحدة تبدأ بـ18 خدمة أساسية، ثم تضيف 46 خدمة للوصول إلى 64، مع أقسام للمواسم المهمة مثل كأس العالم 2034." data-en="Create one tourism platform starting with 18 core services and adding 46 to reach 64, with hubs for major seasons such as World Cup 2034."></p></article><article class="card"><span class="chip coral">03</span><h3 data-ar="الفرضية" data-en="Hypothesis"></h3><p data-ar="إذا تم جمع الخدمات والمعلومات السياحية في منصة ذكية واحدة، فسيقل وقت البحث ويصبح تخطيط الرحلة أكثر سهولة وتنظيمًا." data-en="If tourism services and information are unified in one smart platform, search time should decrease and trip planning should become easier and more organized."></p></article><article class="card"><span class="chip">04</span><h3 data-ar="الخلفية العلمية" data-en="Scientific background"></h3><p data-ar="يعتمد المشروع على المنصات الرقمية وقواعد البيانات والخرائط GPS/GIS وواجهات API وأنظمة التوصية والذكاء الاصطناعي ومبادئ تجربة المستخدم." data-en="The concept draws on digital platforms, databases, GPS/GIS maps, APIs, recommendation systems, AI and UX principles."></p></article><article class="card"><span class="chip sea">05</span><h3 data-ar="المتغيرات" data-en="Variables"></h3><p data-ar="المستقل: استخدام المنصة الموحدة. التابع: سهولة وسرعة تجربة السائح. الضابطة: المدينة والميزانية والمدة ونوع الرحلة." data-en="Independent: using the unified platform. Dependent: travel ease and speed. Controls: city, budget, duration and trip type."></p></article><article class="card"><span class="chip coral">06</span><h3 data-ar="الإجراءات" data-en="Procedure"></h3><p data-ar="تحديد الاحتياجات، بناء 18 خدمة أساسية، اختبارها، إطلاق المنصة، جمع الملاحظات، ثم إضافة الخدمات الجانبية والمتقدمة تدريجيًا." data-en="Identify needs, build and test 18 core services, launch, collect feedback, then add supporting and advanced services gradually."></p></article></div></div></section><section class="section white"><div class="container"><div class="section-head"><div><h2 data-ar="البيانات والرسومات" data-en="Data & charts"></h2><p data-ar="الخطة الحالية تضم 64 خدمة: 18 في الإطلاق و46 في المراحل اللاحقة." data-en="The current roadmap contains 64 services: 18 at launch and 46 in later phases."></p></div></div><div class="dual-feature"><div class="info-panel"><h3 data-ar="توزيع الخدمات" data-en="Service distribution"></h3><div style="display:grid;gap:11px;margin-top:18px"><div><div style="display:flex;justify-content:space-between;font-size:10px"><span data-ar="أساسية جدًا" data-en="Core"></span><b>8</b></div><div class="progress-track"><div class="progress-fill" style="width:44%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px"><span data-ar="أساسية" data-en="Essential"></span><b>10</b></div><div class="progress-track"><div class="progress-fill" style="width:56%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px"><span data-ar="مهمة" data-en="Important"></span><b>16</b></div><div class="progress-track"><div class="progress-fill" style="width:89%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px"><span data-ar="فرعية" data-en="Supporting"></span><b>18</b></div><div class="progress-track"><div class="progress-fill" style="width:100%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px"><span data-ar="متقدمة" data-en="Advanced"></span><b>12</b></div><div class="progress-track"><div class="progress-fill" style="width:67%"></div></div></div></div></div><div class="info-panel"><h3 data-ar="خطة الإطلاق" data-en="Launch plan"></h3><div style="width:230px;height:230px;border-radius:50%;margin:24px auto;background:conic-gradient(var(--palm) 0 28.1%,var(--sand) 28.1% 100%);display:grid;place-items:center"><div style="width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center"><div><b style="font-size:34px;color:var(--palm-900)">28.1%</b><small style="display:block;color:var(--muted)" data-ar="عند الإطلاق" data-en="At launch"></small></div></div></div><div style="display:flex;justify-content:center;gap:15px;font-size:10px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--palm)"></i> 18</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sand)"></i> 46</span></div></div></div></div></section><section class="section"><div class="container"><div class="cards"><article class="card"><h3 data-ar="تحليل البيانات" data-en="Data analysis"></h3><p data-ar="التركيز على 18 خدمة أولًا يقلل نطاق التطوير الأولي ويسمح باختبار الجودة قبل توسيع 46 خدمة إضافية. بعد الإطلاق يجب الاعتماد على بيانات الاستخدام الفعلية لتحديد الأولويات." data-en="Focusing on 18 services first reduces initial scope and enables quality testing before expanding by 46 services. After launch, real usage data should drive priorities."></p></article><article class="card"><h3 data-ar="النتائج" data-en="Results"></h3><p data-ar="النتيجة المتوقعة هي تقليل تشتت المستخدم وتوفير مسار موحد للتخطيط والوصول للمعلومات. هذه نتيجة متوقعة تحتاج للتحقق بعد الإطلاق ببيانات مستخدمين حقيقية." data-en="The expected result is less fragmentation and a unified planning flow. This remains a hypothesis until validated with real users after launch."></p></article><article class="card"><h3 data-ar="الاستنتاج" data-en="Conclusion"></h3><p data-ar="دمج السياحة والتقنية والذكاء الاصطناعي والخرائط والواقع المعزز يمكن أن يقدم تجربة أكثر تنظيمًا، بشرط جودة البيانات وربط مزودي الخدمات." data-en="Combining tourism, technology, AI, maps and AR can create a more organized experience, provided data quality and provider integrations are strong."></p></article><article class="card"><h3 data-ar="التطبيقات" data-en="Applications"></h3><p data-ar="التخطيط، اكتشاف الوجهات، المواسم، النقل، السلة، الإرشاد والواقع المعزز، مع قابلية الربط بالفنادق والمطاعم والفعاليات مستقبلًا." data-en="Planning, discovery, season hubs, mobility, cart, guidance and AR, with future hotel, dining and event integrations."></p></article><article class="card"><h3 data-ar="الأعمال المستقبلية" data-en="Future work"></h3><p data-ar="Backend وقاعدة بيانات وAPIs ومدفوعات وAI حقيقي وخرائط حية وتوقع ازدحام وAR جغرافي وتطبيقات جوال." data-en="Backend, database, APIs, payments, real AI, live maps, crowd prediction, geospatial AR and native mobile apps."></p></article><article class="card"><h3 data-ar="الملخص" data-en="Summary"></h3><p data-ar="TripCo تصور لمنظومة سياحية موحدة تبدأ بالأساسيات ثم تنمو بناءً على بيانات الاستخدام واحتياجات السائح." data-en="TripCo is a unified tourism ecosystem concept that starts with essentials and grows based on usage data and traveler needs."></p></article></div></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/core.js"></script><script src="assets/js/v4.js"></script></body></html>
