<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b4f"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | Architecture</title></head><body data-page="about"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><div class="page-kicker">Platform Architecture</div><h1 data-ar="البنية التقنية المقترحة" data-en="Proposed technical architecture"></h1><p data-ar="كيف يمكن تحويل هذا النموذج الكبير إلى منصة إنتاج فعلية قابلة للتوسع." data-en="How this large prototype can evolve into a scalable production platform."></p></div></section><section class="section"><div class="container"><div class="roadmap"><div class="roadmap-step"><b>Frontend</b><p data-ar="واجهة ويب حديثة + PWA، ثم تطبيقات جوال عند الحاجة." data-en="Modern web app + PWA, followed by mobile apps if needed."></p></div><div class="roadmap-step"><b>API Gateway</b><p data-ar="طبقة موحدة للخرائط والطقس والحجوزات والنقل والفعاليات." data-en="Unified layer for maps, weather, bookings, mobility and events."></p></div><div class="roadmap-step"><b>Backend</b><p data-ar="حسابات، صلاحيات، سلة، خطط، حجوزات، تنبيهات ومحتوى." data-en="Accounts, permissions, cart, plans, bookings, alerts and content."></p></div><div class="roadmap-step"><b>Data + AI</b><p data-ar="قواعد بيانات، تحليلات، توصيات، بحث ذكي وتخصيص." data-en="Databases, analytics, recommendations, smart search and personalization."></p></div></div></div></section><section class="section white"><div class="container"><div class="section-head"><div><h2 data-ar="وحدات المنصة" data-en="Platform modules"></h2></div></div><div class="cards"><div class="card"><h3>Identity & Auth</h3><p data-ar="تسجيل، جلسات، OAuth/MFA، ملفات مستخدمين وموافقات." data-en="Sign-in, sessions, OAuth/MFA, profiles and consent."></p></div><div class="card"><h3>Destination CMS</h3><p data-ar="إدارة المدن والمعالم والصور والمحتوى متعدد اللغات." data-en="Manage cities, landmarks, imagery and multilingual content."></p></div><div class="card"><h3>Trip Engine</h3><p data-ar="بناء الخطط، قواعد التوقيت، المسافات والميزانية." data-en="Build itineraries using time, distance and budget rules."></p></div><div class="card"><h3>Commerce</h3><p data-ar="سلة، طلبات، كوبونات، مدفوعات واسترداد عند الإنتاج." data-en="Cart, orders, coupons, payments and refunds in production."></p></div><div class="card"><h3>TripCo AR</h3><p data-ar="WebXR أو تطبيقات Native مع ARKit/ARCore وتثبيت مكاني." data-en="WebXR or native ARKit/ARCore with spatial anchoring."></p></div><div class="card"><h3>Analytics</h3><p data-ar="قياس التحويل، الاستخدام، جودة البحث ونجاح الخطط." data-en="Measure conversion, usage, search quality and itinerary success."></p></div><div class="card"><h3>Season Hubs</h3><p data-ar="قوالب مستقلة للأحداث الكبرى ومراكز الزوار." data-en="Dedicated templates for major events and visitor hubs."></p></div><div class="card"><h3>Partner Portal</h3><p data-ar="واجهة مستقبلية لمزودي الفنادق والمطاعم والجولات." data-en="Future portal for hotels, restaurants and tour providers."></p></div><div class="card"><h3>Safety & Trust</h3><p data-ar="مصادر موثوقة، تنبيهات، خصوصية، تدقيق ومراقبة إساءة الاستخدام." data-en="Authoritative sources, alerts, privacy, auditing and abuse controls."></p></div></div></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/core.js"></script><script src="assets/js/v4.js"></script></body></html>
