<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f1a"><meta name="description" content="TripCo demo checkout"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | Review booking</title></head><body data-page="cart"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><div class="page-kicker">TripCo Booking Review</div><h1 data-ar="راجع رحلتك قبل التأكيد" data-en="Review your trip before confirmation"></h1><p data-ar="مرحلة مراجعة تجريبية تجمع الفندق والطيران والخدمات والتذاكر التجريبية. لا يتم تحصيل أي مبلغ أو إنشاء حجز فعلي." data-en="A demo review step combining hotels, flights, services and demo tickets. No payment is charged and no real booking is created."></p></div></section><section class="section"><div class="container checkout-layout"><div class="checkout-card"><h2 data-ar="بيانات المسافر الرئيسي" data-en="Lead traveler details"></h2><div class="checkout-grid"><div class="checkout-field"><label data-ar="الاسم الكامل" data-en="Full name"></label><input id="coName" autocomplete="name"></div><div class="checkout-field"><label data-ar="البريد الإلكتروني" data-en="Email"></label><input id="coEmail" type="email" autocomplete="email"></div><div class="checkout-field"><label data-ar="رقم الجوال" data-en="Phone"></label><input id="coPhone" inputmode="tel"></div><div class="checkout-field"><label data-ar="الجنسية" data-en="Nationality"></label><input id="coNationality"></div></div><h3 style="margin-top:24px" data-ar="طريقة التأكيد" data-en="Confirmation method"></h3><label class="pay-option"><input type="radio" name="pay" checked><span><b data-ar="تأكيد تجريبي فقط" data-en="Demo confirmation only"></b><small data-ar="لا يوجد خصم أو دفع. يتم إنشاء رقم
