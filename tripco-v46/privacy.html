<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b4f"><meta name="description" content="TripCo tourism platform prototype for Saudi Arabia"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | Privacy</title></head><body data-page=""><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><div class="page-kicker">Privacy</div><h1 data-ar="سياسة الخصوصية — نموذج" data-en="Privacy policy — prototype"></h1><p data-ar="شرح مبسط لكيفية تعامل النسخة التجريبية مع البيانات." data-en="A simplified explanation of how this demo handles data."></p></div></section><section class="section"><div class="container"><article class="legal-card"><h2 data-ar="التخزين المحلي" data-en="Local storage"></h2><p data-ar="هذه النسخة تحفظ اللغة والحساب التجريبي والمفضلة والسلة وخطط الرحلات داخل LocalStorage في متصفح المستخدم فقط. لا يوجد خادم خلفي في الحزمة الحالية." data-en="This version stores language, demo account, favorites, cart and trip plans in browser LocalStorage. There is no backend server in the current package."></p><h2 data-ar="الكاميرا والموقع" data-en="Camera and location"></h2><p data-ar="ميزة الواقع المعزز تطلب صلاحية الكاميرا فقط عند ضغط المستخدم على زر التشغيل، وتطلب الموقع فقط عند الضغط على زر موقعي. لا يتم إرسال هذه البيانات إلى خادم." data-en="The AR feature requests camera access only when the user starts it, and location only when requested. This data is not sent to a server."></p><h2 data-ar="نسخة الإنتاج" data-en="Production version"></h2><p data-ar="عند تحويل المشروع إلى منتج فعلي يجب تطبيق تشفير، جلسات آمنة، سياسة احتفاظ بالبيانات، موافقات واضحة وربط قانوني مع مزودي الخدمات." data-en="A production version would require encryption, secure sessions, data retention policies, clear consent and compliant provider integrations."></p></article></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/core.js"></script><script src="assets/js/v4.js"></script></body></html>
