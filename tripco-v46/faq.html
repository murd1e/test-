<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b4f"><meta name="description" content="TripCo tourism platform prototype for Saudi Arabia"><link rel="icon" href="assets/icons/tripco-v4-mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/v4.css"><title>TripCo | FAQ</title></head><body data-page="faq"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><div class="page-kicker">FAQ</div><h1 data-i18n="faqHero"></h1><p data-i18n="faqHeroText"></p></div></section><section class="section"><div class="container"><div class="faq-list"><div class="faq-item open"><div class="faq-q"><span data-ar="هل TripCo منصة حكومية؟" data-en="Is TripCo a government platform?"></span><span>+</span></div><div class="faq-a" data-ar="لا. TripCo نموذج مشروع مستقل وتعليمي، وليس خدمة حكومية رسمية." data-en="No. TripCo is an independent educational project prototype, not an official government service."></div></div><div class="faq-item"><div class="faq-q"><span data-ar="هل الحجز والدفع حقيقيان؟" data-en="Are bookings and payments real?"></span><span>+</span></div><div class="faq-a" data-ar="لا. السلة والأسعار والحجوزات المعروضة في هذه النسخة تجريبية لتوضيح تجربة الاستخدام." data-en="No. The cart, prices and booking flows are illustrative for the prototype."></div></div><div class="faq-item"><div class="faq-q"><span data-ar="هل الواقع المعزز حقيقي؟" data-en="Is the AR feature real?"></span><span>+</span></div><div class="faq-a" data-ar="النسخة الحالية تفتح الكاميرا وتعرض طبقات معلومات داخل المتصفح، لكنها لا تستخدم تثبيتًا مكانيًا ثلاثي الأبعاد حقيقيًا. ذلك يحتاج WebXR/ARKit/ARCore أو منصة AR متخصصة." data-en="The current version opens the camera and overlays information in the browser, but it does not use full geospatial 3D anchoring. Production AR would require WebXR/ARKit/ARCore or a dedicated AR stack."></div></div><div class="faq-item"><div class="faq-q"><span data-ar="كيف تعمل الحسابات؟" data-en="How do accounts work?"></span><span>+</span></div><div class="faq-a" data-ar="الحسابات محفوظة محليًا داخل المتصفح لأغراض العرض. المنتج الفعلي يحتاج Backend وقاعدة بيانات وتوثيق آمن." data-en="Accounts are stored locally in the browser for demo purposes. Production requires a backend, database and secure authentication."></div></div><div class="faq-item"><div class="faq-q"><span data-ar="هل يدعم العربية والإنجليزية؟" data-en="Does it support Arabic and English?"></span><span>+</span></div><div class="faq-a" data-ar="نعم، الواجهة الرئيسية والعناصر الديناميكية تدعم التبديل بين العربية والإنجليزية واتجاه RTL/LTR." data-en="Yes. Core UI and dynamic content switch between Arabic and English with RTL/LTR support."></div></div><div class="faq-item"><div class="faq-q"><span data-ar="لماذا 18 ثم 46؟" data-en="Why 18 services first, then 46?"></span><span>+</span></div><div class="faq-a" data-ar="الفكرة هي إطلاق الخدمات الأساسية أولًا، ثم توسيع المنصة تدريجيًا بناءً على الاستخدام والملاحظات." data-en="The concept launches the essential services first, then expands based on usage and feedback."></div></div></div></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/core.js"></script><script src="assets/js/misc.js"></script><script src="assets/js/v4.js"></script></body></html>
